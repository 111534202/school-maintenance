; tools/stable-server.py 啟動 php-cgi 時一律會讀這個資料夾裡的設定（PHP_INI_SCAN_DIR），排在 php.ini 之後，所以這裡的值會蓋過 php.ini。
;
; 為什麼不用命令列的 -d？php-cgi 在網站模式下，只要有 QUERY_STRING（沒有網址參數時是空字串也算），
; 就會把它當成命令列參數，原本的 -d 全部被忽略，上傳上限仍是 php.ini 的 2M。用設定檔才一定有效。

; 附件：一筆最多 5 個、加起來 5 MB，單一檔案也要能到 5 MB（Windows 的 PHP 預設單檔只有 2M）。
upload_max_filesize = 8M
post_max_size = 10M

; 錯誤不要直接印在畫面上（錯誤只寫進紀錄）。
display_errors = 0
